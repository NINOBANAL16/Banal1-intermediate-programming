<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NEONX Sign Up</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">

<style>
  
  <script>
function validateSignup(event){
    event.preventDefault();
    alert("Button is working ✅");
}
</script>
  
body {
  font-family: 'Orbitron', sans-serif;
  background: radial-gradient(circle at top, #0a0f2c, #000);
  color: white;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.signup-box {
  background: rgba(255,255,255,0.05);
  padding: 40px;
  border-radius: 16px;
  backdrop-filter: blur(10px);
  text-align: center;
  width: 320px;
}

input, button {
  width: 100%;
  margin-top: 15px;
  padding: 12px;
  border-radius: 25px;
  border: none;
  outline: none;
  font-family: inherit;
}

input {
  background: rgba(255,255,255,0.1);
  color: white;
}

input::placeholder {
  color: #bbb;
}

button {
  background: linear-gradient(90deg, #00f0ff, #7f00ff);
  color: black;
  font-weight: 600;
  cursor: pointer;
}

.error {
  color: #ff4d4d;
  font-size: 13px;
  margin-top: 10px;
}

.success {
  color: #00ffcc;
  font-size: 13px;
  margin-top: 10px;
}

.login-text {
  margin-top: 20px;
  font-size: 0.85rem;
  color: #ccc;
}
</style>

<script>
function validateSignup(event){

  event.preventDefault();

  let username = document.getElementById("username").value.trim();
  let email = document.getElementById("email").value.trim();
  let password = document.getElementById("password").value;
  let confirm = document.getElementById("confirm").value;

  let message = document.getElementById("message");
  message.className = "error";
  message.innerHTML = "";

  if(username === ""){
    message.innerHTML = "Username is required";
    return;
  }

  if(username.length < 4){
    message.innerHTML = "Username must be at least 4 characters";
    return;
  }

  if(email === ""){
    message.innerHTML = "Email is required";
    return;
  }

  if(!email.includes("@") || !email.includes(".")){
    message.innerHTML = "Enter a valid email";
    return;
  }

  if(password.length < 6){
    message.innerHTML = "Password must be at least 6 characters";
    return;
  }

  if(password !== confirm){
    message.innerHTML = "Passwords do not match";
    return;
  }

  message.className = "success";
  message.innerHTML = "Account Created Successfully ✅";

  setTimeout(()=>{
    window.location.href="login.html";
  },1500);
}
</script>

</head>
<body>

<div class="signup-box">
<h2>Create Account</h2>

<form onsubmit="validateSignup(event)">
<input type="text" id="username" placeholder="Username">
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">
<input type="password" id="confirm" placeholder="Confirm Password">

<button type="submit">Sign Up</button>
</form>

<div id="message"></div>

<p class="login-text">
Already have an account?
<a href="login.html">Login</a>
</p>

</div>

</body>
</html>
