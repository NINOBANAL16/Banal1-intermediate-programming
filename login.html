<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NEONX Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Orbitron', sans-serif;
  background: radial-gradient(circle at top, #0a0f2c, #000);
  color: white;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.login-box {
  background: rgba(255,255,255,0.05);
  padding: 40px;
  border-radius: 16px;
  backdrop-filter: blur(10px);
  text-align: center;
  width: 300px;
}

input, button {
  width: 100%;
  margin-top: 15px;
  padding: 12px;
  border-radius: 25px;
  border: none;
}

button {
  background: linear-gradient(90deg, #00f0ff, #7f00ff);
  cursor: pointer;
}

.error {
  color: #ff4d4d;
  font-size: 13px;
  margin-top: 10px;
}
</style>

<script>
function validateLogin(event) {

  let username = document.getElementById("username").value.trim();
  let password = document.getElementById("password").value.trim();
  let error = document.getElementById("error");

  error.innerHTML = "";

  if (username === "") {
    error.innerHTML = "Username is required";
    event.preventDefault();
    return;
  }

  if (password === "") {
    error.innerHTML = "Password is required";
    event.preventDefault();
    return;
  }

  if (password.length < 6) {
    error.innerHTML = "Password must be at least 6 characters";
    event.preventDefault();
    return;
  }

  // If valid → go to profile
  window.location.href = "profile.html";
}
</script>

</head>

<body>

<div class="login-box">
<h2>Login to NEONX</h2>

<form onsubmit="validateLogin(event)">
<input type="text" id="username" placeholder="Username">
<input type="password" id="password" placeholder="Password">

<button type="submit">Login</button>
</form>

<div id="error" class="error"></div>

<p class="signup-text">
Don’t have an account?
<a href="signup.html">Sign up</a>
</p>

</div>

</body>
</html>
